<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
        }

        .day {
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #ffffff;
        }

        .day h3 {
            margin-top: 0;
        }

        .day li {
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>🏃 FitBuddy AI</h1>

        <p>Your Personal Fitness Assistant</p>

    </div>



    <div class="container">


        <div class="card">

            <h2>Generate Your Fitness Plan</h2>


            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <label>Age</label>

            <input
                type="number"
                id="age"
                placeholder="Enter your age"
            >


            <label>Activity Level</label>

            <select id="activity">

                <option value="">
                    Select activity level
                </option>

                <option value="beginner">
                    Beginner
                </option>

                <option value="moderate">
                    Moderately Active
                </option>

                <option value="active">
                    Active
                </option>

            </select>



            <label>Fitness Goal</label>

            <select id="goal">

                <option value="">
                    Select your goal
                </option>

                <option value="general">
                    General Fitness
                </option>

                <option value="strength">
                    Build Strength
                </option>

                <option value="flexibility">
                    Improve Flexibility
                </option>

                <option value="endurance">
                    Improve Endurance
                </option>

            </select>



            <button id="generateButton">

                🤖 Generate 7-Day Plan

            </button>


        </div>



        <div class="card" id="result">

            <h2>📅 Your Fitness Plan</h2>

            <div id="plan"></div>

        </div>


    </div>



    <script>

        document
            .getElementById("generateButton")
            .addEventListener("click", generatePlan);



        async function generatePlan() {

            const name =
                document.getElementById("name").value;

            const age =
                document.getElementById("age").value;

            const activity =
                document.getElementById("activity").value;

            const goal =
                document.getElementById("goal").value;



            if (!name || !age || !activity || !goal) {

                alert("Please fill all the details.");

                return;

            }



            const button =
                document.getElementById("generateButton");

            const result =
                document.getElementById("result");

            const planElement =
                document.getElementById("plan");



            button.disabled = true;

            button.innerText = "🤖 Generating...";



            planElement.innerHTML = `
                <div class="loading">
                    Creating your 7-day plan...
                </div>
            `;

            result.style.display = "block";



            try {

                const response = await fetch(
                    "/generate-plan",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            age: age,

                            activity: activity,

                            goal: goal

                        })
                    }
                );



                const data =
                    await response.json();



                console.log(
                    "Backend response:",
                    data
                );



                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Server error"
                    );

                }



                let cards = "";



                data.plan.days.forEach(
                    function(day) {

                        let activities = "";



                        day.activities.forEach(
                            function(item) {

                                activities +=
                                    `<li>${item}</li>`;

                            }
                        );



                        cards += `

                            <div class="day">

                                <h3>
                                    📅 ${day.title}
                                </h3>

                                <h4>
                                    🏃 Activities
                                </h4>

                                <ul>
                                    ${activities}
                                </ul>

                                <p>
                                    💡
                                    <strong>
                                        Tip:
                                    </strong>

                                    ${day.tip}
                                </p>

                            </div>

                        `;

                    }
                );



                planElement.innerHTML = `

                    <div class="day">

                        <h3>
                            👋 Hello ${data.name}
                        </h3>

                        <p>
                            <strong>Age:</strong>
                            ${data.age}
                        </p>

                        <p>
                            <strong>Activity:</strong>
                            ${data.activity}
                        </p>

                        <p>
                            <strong>Goal:</strong>
                            ${data.goal}
                        </p>

                    </div>


                    ${cards}

                `;



            }

            catch (error) {

                console.error(
                    "Error:",
                    error
                );

                planElement.innerHTML = `

                    <div class="day">

                        <h3>
                            ❌ Something went wrong
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

            finally {

                button.disabled = false;

                button.innerText =
                    "🤖 Generate 7-Day Plan";

            }

        }

    </script>


</body>

</html>
